name: Daily padyam

on:
  schedule:
    - cron: "0 1 * * *"        # 01:00 UTC = 06:30 IST (GitHub may start it up to ~30 min late)
  workflow_dispatch:
    inputs:
      verse:
        description: "Post a specific padyam number (leave empty for today's)"
        required: false
      only:
        description: "Only these platforms, e.g. instagram,youtube (empty = all enabled in config.json)"
        required: false
      dry_run:
        description: "Build everything but don't post"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-padyam
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Telugu text shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0
          pip install -q -r requirements.txt
          python -c "from PIL import features; assert features.check('raqm'), 'Telugu shaping (raqm) missing'"

      - name: Render today's video, image and share page
        id: build
        run: python daily.py ${{ inputs.verse && format('--verse {0}', inputs.verse) || '' }}

      - uses: actions/configure-pages@v5
        if: steps.build.outputs.post == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.post == 'true'
        with:
          path: site

      - name: Publish share page (GitHub Pages)
        id: deploy
        if: steps.build.outputs.post == 'true'
        uses: actions/deploy-pages@v4

      - name: Post to Instagram / YouTube / reminders
        if: steps.build.outputs.post == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: >
          python publish.py --site-url "${{ steps.deploy.outputs.page_url }}"
          ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save posting log (also keeps the daily schedule alive)
        if: always() && steps.build.outputs.post == 'true'
        run: |
          git config user.name "padyam-bot"
          git config user.email "padyam-bot@users.noreply.github.com"
          git add state/posted_log.csv 2>/dev/null || true
          git commit -m "Posted padyam ${{ steps.build.outputs.n }} on ${{ steps.build.outputs.date }}" || echo "nothing to commit"
          git push || echo "push failed (log not saved)"
